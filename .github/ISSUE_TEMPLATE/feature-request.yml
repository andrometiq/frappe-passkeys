name: Feature request
description: Suggest a new capability or a change.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: Check the [roadmap](https://github.com/Andrometiq/frappe-passkeys#roadmap) first; it may already be planned.

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What should the app do? Name any WebAuthn, browser or Frappe behaviour it relies on.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: Other approaches you considered or use now.
