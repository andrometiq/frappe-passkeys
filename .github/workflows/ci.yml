# CI for frappe-passkeys — 3-cell frappe matrix (version-15 / version-16 / develop).
#
# The version pins below are binding:
#   v15     → Python 3.10 / Node 18 / mariadb:10.6
#   v16     → Python 3.14 / Node 24 / mariadb:11.8
#   develop → Python 3.14 / Node 24 / mariadb:11.8
#
# The daily upstream-drift cron lives in upstream-drift.yml and calls this workflow
# via workflow_call (same matrix — frappe branch tips are the moving part).
# workflow_dispatch's frappe-ref input points every cell at an arbitrary frappe
# tag/branch, e.g. the v15.107.0 co-installability floor tag.

name: CI

on:
  push:
    branches: [develop, version-15, version-16]
  pull_request:
  workflow_dispatch:
    inputs:
      frappe-ref:
        description: "Ad-hoc frappe ref (branch/tag) to test instead of the matrix ref (e.g. v15.107.0)"
        required: false
        type: string
  workflow_call:
    inputs:
      frappe-ref:
        description: "Ad-hoc frappe ref (branch/tag) to test instead of the matrix ref"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.number || github.run_id }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # All four hook-path modules (auth_hooks, boot, install, shims/login_page)
      # now exist and are proven import-clean of webauthn (integration verified
      # the gate locally with webauthn blocked), so the gate is strict: a missing
      # hook-path module now FAILS instead of warning.
      IMPORT_GATE_STRICT: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10" # straddle floor: ruff target-version=py310; frappe v15 minimum

      - name: Detect pre-commit config
        id: precommit
        run: |
          if [ -f .pre-commit-config.yaml ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: pre-commit (ruff, target py310)
        if: steps.precommit.outputs.exists == 'true'
        uses: pre-commit/action@v3.0.1

      - name: Ruff fallback (until .pre-commit-config.yaml lands)
        if: steps.precommit.outputs.exists == 'false'
        run: |
          if [ -f pyproject.toml ]; then
            pipx run ruff check .
          else
            echo "::warning::no .pre-commit-config.yaml or pyproject.toml yet — lint skipped (scaffold phase)"
          fi

      # Hard rule: auth_hooks/boot/install/shims.login_page fire on
      # every login / page render and must import WITHOUT the webauthn library —
      # a broken cryptography wheel must never take down logins.
      - name: Import-graph gate (hook-path modules import without webauthn)
        run: bash .github/helper/import_gate.sh

  server-tests:
    name: Server (frappe ${{ matrix.frappe-branch }})
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - frappe-branch: version-15
            python-version: "3.10" # frappe v15: requires-python >=3.10,<3.15
            node-version: 18
            mariadb-image: "mariadb:10.6"
          - frappe-branch: version-16
            python-version: "3.14" # frappe v16: requires-python >=3.14,<3.15
            node-version: 24
            mariadb-image: "mariadb:11.8"
          - frappe-branch: develop
            python-version: "3.14"
            node-version: 24
            mariadb-image: "mariadb:11.8"
    services:
      mariadb:
        image: ${{ matrix.mariadb-image }}
        env:
          MARIADB_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mariadb-admin ping"
          --health-interval=5s
          --health-timeout=2s
          --health-retries=3
          --tmpfs=/var/lib/mysql:rw,noexec,nosuid,size=2g
    steps:
      - name: Clone
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # Everything under passkeys/ must compile on the v15 cell's Python 3.10
      # (the straddle floor).
      - name: Validate package syntax on this Python
        run: python -m compileall -q -f passkeys

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Add test site to hosts
        run: echo "127.0.0.1 test_site" | sudo tee -a /etc/hosts

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ matrix.frappe-branch }}-${{ hashFiles('**/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-${{ matrix.frappe-branch }}-

      - name: Install bench, frappe, site
        run: bash "${GITHUB_WORKSPACE}/.github/helper/install.sh"
        env:
          FRAPPE_BRANCH: ${{ inputs.frappe-ref || matrix.frappe-branch }}
          BUILD_ASSETS: "no"

      - name: Run server tests
        working-directory: /home/runner/frappe-bench
        run: bench --site test_site run-tests --app passkeys

      - name: Show bench logs
        if: failure()
        run: |
          cat /home/runner/frappe-bench/bench_start.log || true
          tail -n 200 /home/runner/frappe-bench/logs/*.log* || true

  ui-tests:
    name: UI (frappe ${{ matrix.frappe-branch }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - frappe-branch: version-15
            python-version: "3.10"
            node-version: 18
            mariadb-image: "mariadb:10.6"
          - frappe-branch: version-16
            python-version: "3.14"
            node-version: 24
            mariadb-image: "mariadb:11.8"
          - frappe-branch: develop
            python-version: "3.14"
            node-version: 24
            mariadb-image: "mariadb:11.8"
    services:
      mariadb:
        image: ${{ matrix.mariadb-image }}
        env:
          MARIADB_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mariadb-admin ping"
          --health-interval=5s
          --health-timeout=2s
          --health-retries=3
          --tmpfs=/var/lib/mysql:rw,noexec,nosuid,size=2g
    steps:
      - name: Clone
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Add test site to hosts
        run: echo "127.0.0.1 test_site" | sudo tee -a /etc/hosts

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ matrix.frappe-branch }}-${{ hashFiles('**/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-${{ matrix.frappe-branch }}-

      - name: Cache cypress binary
        uses: actions/cache@v4
        with:
          path: ~/.cache/Cypress
          key: ${{ runner.os }}-cypress

      - name: Install bench, frappe, site (with assets)
        run: bash "${GITHUB_WORKSPACE}/.github/helper/install.sh"
        env:
          FRAPPE_BRANCH: ${{ inputs.frappe-ref || matrix.frappe-branch }}
          BUILD_ASSETS: "yes"

      - name: Site setup for UI tests
        working-directory: /home/runner/frappe-bench
        run: |
          # Cypress drives a LIVE bench (never frappe.flags.in_test), so mark the
          # ephemeral CI site a developer/test bench: developer_mode satisfies the
          # app's UI-test-helper guard, allow_tests mirrors frappe's own UI CI, and
          # ignore_csrf skips CSRF for the automated cross-origin cy.request calls.
          bench --site test_site set-config developer_mode 1 --parse
          bench --site test_site set-config allow_tests 1 --parse
          bench --site test_site set-config ignore_csrf 1 --parse
          # Disable the scheduler on the ephemeral UI-test site: its every-minute job
          # writes contend with the desk-boot tabSessions write on CI's constrained
          # tmpfs MariaDB, occasionally deadlocking into a transient HTTP 508.
          bench --site test_site scheduler disable
          bench --site test_site execute frappe.utils.install.complete_setup_wizard
          bench --site test_site execute frappe.tests.ui_test_helpers.create_test_user

      - uses: browser-actions/setup-chrome@latest

      - name: Export browser path
        run: echo "BROWSER_PATH=$(which chrome)" >> "$GITHUB_ENV"

      # bench run-ui-tests cds into apps/passkeys and runs the app's own Cypress
      # suite with the cypress@^13 toolchain frappe auto-installs into apps/frappe
      # (frappe/commands/testing.py). Until the app ships cypress.config.js the
      # spec run is skipped — the install/resolver legs above still validated the cell.
      - name: Run Cypress UI tests
        working-directory: /home/runner/frappe-bench
        env:
          # The desk user-menu dropdown DOM varies by Frappe version; the navbar specs
          # gate their menu-navigation tests to develop via this value (upstream S2).
          CYPRESS_frappeBranch: ${{ matrix.frappe-branch }}
        run: |
          if [ ! -f "${GITHUB_WORKSPACE}/cypress.config.js" ] && [ ! -f "${GITHUB_WORKSPACE}/cypress.config.ts" ]; then
            echo "::warning::no cypress config at app root yet — UI specs skipped for this cell"
            exit 0
          fi
          bench --site test_site run-ui-tests passkeys --headless --browser "$BROWSER_PATH"

      - name: Upload Cypress artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-${{ matrix.frappe-branch }}
          path: |
            /home/runner/frappe-bench/apps/passkeys/cypress/screenshots
            /home/runner/frappe-bench/apps/passkeys/cypress/videos
          if-no-files-found: ignore

      - name: Show bench logs
        if: failure()
        run: |
          cat /home/runner/frappe-bench/bench_start.log || true
          tail -n 200 /home/runner/frappe-bench/logs/*.log* || true

  node-tests:
    name: Node (JS unit)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      # Dependency-free node:test suites (no package.json / jest) covering the client
      # ceremony + policy logic. The glob is required on node 24 (a bare dir errors).
      - name: Run JS unit tests
        run: node --test 'passkeys/tests/js/*.test.js'

  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history — gitleaks scans every commit, not just the tip

      # Run the gitleaks binary directly. The gitleaks-action requires a paid licence
      # for organization accounts; the binary is free and reads the repo's .gitleaks.toml.
      - name: Install gitleaks
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.0/gitleaks_8.30.0_linux_x64.tar.gz \
            | tar -xz -C /tmp gitleaks
          sudo install /tmp/gitleaks /usr/local/bin/gitleaks
      - name: gitleaks (full history)
        run: gitleaks git --no-banner --redact --log-opts="--all"

  success:
    # Single required check for branch protection ("CI / Success") —
    # fan-in pattern from frappe/frappe ui-tests.yml.
    name: Success
    needs: [lint, node-tests, server-tests, ui-tests, secrets]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Evaluate results
        run: |
          test "${{ needs.lint.result }}" = "success"
          test "${{ needs.node-tests.result }}" = "success"
          test "${{ needs.server-tests.result }}" = "success"
          test "${{ needs.ui-tests.result }}" = "success"
          test "${{ needs.secrets.result }}" = "success"
