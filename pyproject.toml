[project]
name = "passkeys"
authors = [{ name = "Frappe Passkeys Contributors" }]
description = "Passkey (WebAuthn) authentication for Frappe"
# Keep interpreter support aligned with the tested Frappe v15-v17 window. A
# Python 3.15 roll-forward requires an explicit matrix update first.
requires-python = ">=3.10,<3.15"
readme = "README.md"
license = { file = "LICENSE" }
dynamic = ["version"]
dependencies = [
	# Auth-critical runtime dependency: 2.8.0 is the version validated across
	# all three Frappe cells; 3.x conflicts with their cryptography stack. Upgrade
	# only together with the resolver and ceremony test matrices.
	"webauthn==2.8.0",
]

[build-system]
# PEP 517 runs outside the project environment, so pin the build backend too.
requires = ["flit_core==3.12.0"]
build-backend = "flit_core.buildapi"

[tool.bench.frappe-dependencies]
frappe = ">=15.107.0,<18.0.0"

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = [
    "F",
    "E",
    "W",
    "I",
    "UP",
    "B",
    "RUF",
]
ignore = [
    "B017", # assertRaises(Exception) - should be more specific
    "B018", # useless expression, not assigned to anything
    "B023", # function doesn't bind loop variable - will have last iteration's value
    "B904", # raise inside except without from
    "E101", # indentation contains mixed spaces and tabs
    "E402", # module level import not at top of file
    "E501", # line too long
    "E741", # ambiguous variable name
    "F401", # "unused" imports
    "F403", # can't detect undefined names from * import
    "F405", # can't detect undefined names from * import
    "F722", # syntax error in forward type annotation
    "W191", # indentation contains tabs
    "UP030", # Use implicit references for positional format fields (translations)
    "UP031", # Use format specifiers instead of percent format
    "UP032", # Use f-string instead of `format` call (translations)
    "UP037", # quoted annotations
]

[tool.ruff.format]
quote-style = "double"
indent-style = "tab"
docstring-code-format = true
